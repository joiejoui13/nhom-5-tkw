    <script>

            },
            {

            },
            {

            },
            {
                title: "GK. GỌNG KÍNH THỜI TRANG",
                code: "111100030 (50.16.145)",
                brand: "KEOLY",
                colors: ["purple", "pink", "blue"],
                available: false,
                btnClass: "orange"
            }
        ];

        function generateProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                
                const colorsHtml = product.colors.map(color => 
                    `<div class="color-dot ${color}"></div>`
                ).join('');

                productCard.innerHTML = `
                    <div class="brand-badge">${product.brand}</div>
                    <div class="product-image">
                        <div class="glasses-icon">👓</div>
                        ${!product.available ? '<div class="out-of-stock-badge">Hết hàng</div>' : ''}
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-code">${product.code}</div>
                        <div class="color-options">
                            ${colorsHtml}
                        </div>
                        <a href="#" class="contact-btn ${product.btnClass}" onclick="contactProduct('${product.code}')">
                            Liên hệ ngay →
                        </a>
                    </div>
                `;
                
                grid.appendChild(productCard);
            });
        }

        function contactProduct(code) {
            alert(`Liên hệ cho sản phẩm: ${code}`);
        }

        function showMore(type) {
            alert(`Hiển thị thêm ${type}`);
        }

        // Filter functionality
        document.addEventListener('change', function(e) {
            if (e.target.type === 'checkbox') {
                // Add filter logic here
                console.log('Filter changed:', e.target.name, e.target.value, e.target.checked);
            }
        });

        // Sort functionality
        document.querySelector('.sort-select').addEventListener('change', function(e) {
            console.log('Sort changed:', e.target.value);
            // Add sort logic here
        });

        // Initialize products
        generateProducts();
