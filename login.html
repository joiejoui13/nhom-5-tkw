<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập - Optic Care</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #c0f7f3; /* Changed to the light teal from the previous step */
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Styles for the simple header */
    header {
      background-color: #19c8c2; /* Teal background */
      color: white;
      padding: 10px 30px;      /* Padding */
      font-size: 20px;
      font-weight: bold;
      display: flex;            /* For aligning logo and text */
      align-items: center;      /* Vertical alignment */
      gap: 15px;                /* Space between logo and text */
    }
    .header-logo {
      height: 40px;             /* Logo height */
      width: auto;              /* Maintain aspect ratio */
    }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 90%;
      max-width: 960px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
      display: flex;
      overflow: hidden;
    }

    .login-img {
      flex: 1;
      min-width: 50%;
      display: block;
    }

    .login-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-form {
      flex: 1;
      padding: 40px;
    }

    .form-label {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .form-control {
      border: 1px solid #19c8c2;
      border-radius: 6px;
    }

    .btn-login {
      background-color: #19c8c2;
      color: white;
      border: none;
      border-radius: 6px;
    }

    .btn-google {
      border: 1px solid #ddd;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: white;
    }

    .btn-google img {
      height: 20px;
    }

    .text-muted-small {
      font-size: 14px;
    }

    a {
      color: #19c8c2;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }

      .login-img {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Header (Styled by custom CSS in this file) -->
  <header>
    <a href="Trang_chu.html" style="text-decoration: none; display: flex; align-items: center; gap: 15px; color: white;">
      <img src="picture/logo-trang.png" alt="Optic Care Logo" class="header-logo">
      <span>Optic Care</span>
    </a>
  </header>

  <div class="main-container">
    <div class="login-container">
      <div class="login-img">
        <img src="picture/model-taikhoan.jpg" alt="Login Image" />
      </div>
      <div class="login-form">
        <h4 class="fw-bold mb-1 text-center">Đăng nhập</h4>
        <p class="text-muted mb-4">Hãy đăng nhập để được hưởng đặc quyền riêng dành cho bạn</p>
        <form>
          <div class="mb-3">
            <label for="email" class="form-label">TÀI KHOẢN *</label>
            <input type="text" class="form-control" id="email" placeholder="Nhập tài khoản" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">MẬT KHẨU *</label>
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Lưu tài khoản</label>
          </div>
          <button type="submit" class="btn btn-login w-100 mb-3">Đăng nhập</button>
          <div class="mb-3 text-center">
            <a href="#">Quên mật khẩu?</a>
          </div>
          <div class="mb-3">
            <button type="button" class="btn-google w-100">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Icon">
              Đăng nhập bằng <strong>Google</strong>
            </button>
          </div>
          <div class="text-center text-muted-small mt-3">
            Bạn chưa có tài khoản Optic Care? <a href="signin.html">Đăng ký ngay</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
