<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang Thanh Toán</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .error {
      border-color: red;
    }
  </style>
</head>
<body class="bg-gray-100 py-10">

  <div class="max-w-7xl mx-auto bg-white p-8 rounded shadow flex flex-col lg:flex-row gap-6">
    <!-- Form thông tin -->
    <div class="w-full lg:w-2/3">
      <h1 class="text-2xl font-bold mb-6">THANH TOÁN</h1>

      <div class="grid grid-cols-1 gap-4">
        <input id="name" type="text" placeholder="Họ và tên *" class="w-full px-4 py-2 border rounded" />
        <input id="phone" type="text" placeholder="Số điện thoại *" class="w-full px-4 py-2 border rounded" />
        <input id="email" type="email" placeholder="Email *" class="w-full px-4 py-2 border rounded" />
        <input id="province" type="text" placeholder="Tỉnh/Thành phố *" class="w-full px-4 py-2 border rounded" />
        <input id="district" type="text" placeholder="Quận/Huyện *" class="w-full px-4 py-2 border rounded" />
        <input id="ward" type="text" placeholder="Xã/Phường *" class="w-full px-4 py-2 border rounded" />
        <input id="address" type="text" placeholder="Địa chỉ chi tiết *" class="w-full px-4 py-2 border rounded" />
        <textarea id="note" placeholder="Thông tin bổ sung" class="w-full px-4 py-2 border rounded"></textarea>

        <!-- Hình thức thanh toán -->
        <select id="paymentMethod" class="w-full px-4 py-2 border rounded">
          <option value="">Chọn hình thức thanh toán *</option>
          <option value="cod">Thanh toán khi nhận hàng (COD)</option>
          <option value="bank">Chuyển khoản ngân hàng</option>
          <option value="card">Thẻ tín dụng/Ghi nợ</option>
          <option value="momo">Ví MoMo</option>
        </select>
      </div>
    </div>

    <!-- Giỏ hàng và thanh toán -->
    <div class="w-full lg:w-1/3 bg-gray-50 p-6 rounded shadow">
      <h2 class="text-xl font-semibold mb-4">Nhập mã giảm giá</h2>
      <div class="flex mb-6">
        <input type="text" class="w-full px-4 py-2 border rounded-l" placeholder="Nhập mã giảm giá" />
        <button class="bg-teal-400 px-4 text-white rounded-r hover:bg-teal-500">Áp dụng</button>
      </div>

      <!-- Danh sách sản phẩm -->
      <h3 class="font-semibold mb-2">Sản phẩm</h3>
      <div class="space-y-4 mb-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="picture/gong-kinh1.png" alt="Kính" class="w-12 h-12 object-cover" />
            <div>
              <p class="text-sm font-medium">GK. GỌNG NHỰA CỨNG AN2127 (55.17.146)</p>
              <p class="text-xs text-gray-500">Màu sắc: Đen</p>
            </div>
          </div>
          <p class="font-semibold">880.000₫</p>
        </div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="picture/gong-kinh3.png" alt="Kính" class="w-12 h-12 object-cover" />
            <div>
              <p class="text-sm font-medium">GK.GỌNG KÍNH THỜI TRANG 3013 48 (48.18.142)</p>
              <p class="text-xs text-gray-500">Màu sắc: Trắng </p>
            </div>
          </div>
          <p class="font-semibold">450.000₫</p>
        </div>
      </div>

      <!-- Chi tiết thanh toán -->
      <div class="text-sm text-gray-700 space-y-2 border-t pt-4">
        <div class="flex justify-between">
          <span>Tạm tính</span>
          <span>1.330.000₫</span>
        </div>
        <div class="flex justify-between">
          <span>Phí vận chuyển</span>
          <span>30.000₫</span>
        </div>
        <div class="flex justify-between">
          <span>Giảm</span>
          <span>0₫</span>
        </div>
        <hr />
        <div class="flex justify-between font-semibold text-base pt-2">
          <span>Tổng cộng</span>
          <span class="text-red-600">1.360.000₫</span>
        </div>
      </div>

      <!-- Nút xác nhận -->
      <button id="payButton" class="mt-6 w-full bg-cyan-400 text-white py-3 rounded hover:bg-cyan-500 transition">
        Xác nhận thanh toán
      </button>
      <p id="result" class="mt-4 text-green-600 font-medium hidden"></p>
    </div>
  </div>

  <script>
    document.getElementById("payButton").addEventListener("click", function () {
      const fields = [
        "name", "phone", "email", "province", "district", "ward", "address", "paymentMethod"
      ].map(id => document.getElementById(id));

      const result = document.getElementById("result");
      let isValid = true;

      fields.forEach(input => {
        input.classList.remove("error");
        if (!input.value.trim()) {
          input.classList.add("error");
          isValid = false;
        }
      });

      if (!isValid) {
        alert("Vui lòng điền đầy đủ thông tin bắt buộc!");
        result.classList.add("hidden");
        return;
      }

      const paymentMethod = document.getElementById("paymentMethod").value;
      let paymentText = "";

      switch (paymentMethod) {
        case "cod": paymentText = "Thanh toán khi nhận hàng (COD)"; break;
        case "bank": paymentText = "Chuyển khoản ngân hàng"; break;
        case "card": paymentText = "Thẻ tín dụng/Ghi nợ"; break;
        case "momo": paymentText = "Ví MoMo"; break;
      }

      // Mô phỏng xử lý
      setTimeout(() => {
        result.classList.remove("hidden");
        result.textContent = `✅ Thanh toán thành công! Bạn đã chọn: ${paymentText}. Cảm ơn bạn đã mua hàng.`;
      }, 500);
    });
  </script>

</body>
</html>
